<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النخبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.href='index.html'">
            <img src="LOGO1.jpeg" alt="شعار البطولة">
            <span>كأس النخبة الجنوبي</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">العودة للرئيسية</a></li>
            </ul>
        </nav>
    </header>

    <!-- بطاقة تسجيل الدخول (مطابقة تماماً للصورة) -->
    <main id="login-section" class="section active">
        <div class="elite-form-container">
            <i class="card-icon fas fa-user" style="font-size: 3.5rem;"></i>
            <h3 class="card-title" style="margin-top: 10px;">تسجيل الدخول</h3>
            <span class="card-subtitle" style="margin-bottom: 30px;">LOGIN</span>
            
            <form onsubmit="loginUser(event)" style="width: 100%;">
                <div class="input-group">
                    <i class="fas fa-user-circle"></i>
                    <input type="email" id="email" required placeholder="البريد الإلكتروني أو رقم الجوال">
                </div>
                <!-- حقل كلمة المرور مخفي مؤقتاً كما طلبنا سابقاً ولكن يمكن إضافته هنا بنفس كلاس input-group -->
                
                <button type="submit" class="btn-gold" style="width: 100%;">
                    دخول <i class="fas fa-arrow-left"></i>
                </button>
                <div id="login-error" style="color: var(--danger-color); text-align: center; margin-top: 15px;"></div>
            </form>
        </div>
    </main>

    <!-- قسم لوحة تحكم المستخدم (بعد الدخول) -->
    <main id="dashboard-section" class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 class="section-title" style="margin: 0;">لوحة الفريق: <span id="user-email" style="color: var(--text-white); font-size:1.5rem;"></span></h2>
            <button class="btn-outline" style="border-color: var(--danger-color); color: var(--danger-color);" onclick="logoutUser()">تسجيل خروج</button>
        </div>

        <div class="dashboard-grid">
            <div class="elite-card">
                <div class="card-content">
                    <i class="card-icon fas fa-users"></i>
                    <h3 class="card-title">إدارة فريقي</h3>
                    <div class="arrow-btn"><i class="fas fa-arrow-left"></i></div>
                </div>
            </div>
            
            <div class="elite-card">
                <div class="card-content">
                    <h3 class="card-title" style="color: var(--gold-main);">حالة الطلب</h3>
                    <p style="color:var(--text-white); margin-top:10px;">التسجيل: <span style="color: var(--gold-light);">بانتظار المراجعة</span></p>
                    <p style="color:var(--text-white);">الدفع: <span style="color: var(--danger-color);">غير مكتمل</span></p>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
