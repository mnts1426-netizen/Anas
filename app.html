<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الفرق - كأس النخبة الجنوبي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيقات إضافية خاصة بالنماذج (Forms) للثيم الداكن */
        .form-container {
            max-width: 400px;
            margin: 50px auto;
            background: var(--secondary-color);
            padding: 30px;
            border-radius: 8px;
            border-top: 3px solid var(--accent-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-color);}
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            font-family: inherit;
            background-color: var(--primary-color);
            color: var(--text-dark);
        }
        .form-group input:focus { outline: none; border-color: var(--accent-color); }
        .error-msg { color: var(--danger-color); font-size: 0.9rem; margin-top: 10px; text-align: center;}
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" style="cursor:pointer;" onclick="window.location.href='index.html'">
            <img src="WhatsApp Image 2026-09-26 at 1.15.13 PM.jpeg" alt="شعار البطولة" style="height: 50px; margin-left: 10px;">
            <span style="color: var(--accent-color);">كأس النخبة الجنوبي</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
            </ul>
        </nav>
    </header>

    <!-- قسم تسجيل الدخول (بدون باسوورد) -->
    <main id="login-section" class="section active">
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 10px;">دخول ممثلي الفرق</h2>
            <p style="text-align: center; color: var(--text-light); margin-bottom: 20px; font-size: 0.9rem;">
                يمكنك الدخول باستخدام بريدك الإلكتروني فقط في هذه المرحلة.
            </p>
            <form onsubmit="loginUser(event)">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 10px;">تسجيل الدخول</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </main>

    <!-- قسم لوحة تحكم المستخدم (يظهر بعد الدخول) -->
    <main id="dashboard-section" class="section">
        <div class="dashboard-header">
            <h2 style="margin: 0;">أهلاً بك، <span id="user-email" style="color: var(--text-light);"></span></h2>
            <button class="btn btn-outline" style="color: var(--danger-color); border-color: var(--danger-color);" onclick="logoutUser()">تسجيل خروج</button>
        </div>

        <div class="grid-container">
            <!-- بطاقة الفرق الخاصة بي -->
            <div class="card">
                <h3>فريقي</h3>
                <p>إدارة بيانات فريقك ولاعبيك.</p>
                <br>
                <button class="btn btn-outline">إدارة الفريق</button>
            </div>

            <!-- بطاقة التسجيل في بطولة -->
            <div class="card">
                <h3>البطولات</h3>
                <p>سجل فريقك في البطولات المتاحة وتابع حالة طلبك.</p>
                <br>
                <button class="btn btn-primary">طلب تسجيل جديد</button>
            </div>
            
            <!-- بطاقة حالة الطلبات -->
            <div class="card">
                <h3>حالة الطلبات</h3>
                <p>حالة التسجيل: <span style="color: var(--highlight-color); font-weight:bold;">بانتظار المراجعة</span></p>
                <p>حالة الدفع: <span style="color: var(--danger-color); font-weight:bold;">غير مكتمل</span></p>
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
